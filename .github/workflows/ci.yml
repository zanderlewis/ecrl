name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: crystal spec

      - name: Verify build
        run: crystal build src/entry.cr -o /tmp/ecrl
